name: Vehicle regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vehicle-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run vehicle regression tests
        run: npm test
